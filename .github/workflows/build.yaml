name: Build & Push image

on:
  push:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: ./build.sh
      - run: podman login ghcr.io -u imbev -p ${{ secrets.GITHUB_TOKEN }}
      - run: podman push llamalinux ghcr.io/imbev/llamalinux:latest
